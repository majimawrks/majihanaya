[package]
name = "majihanaya"
version = "0.1.4"
edition = "2024"
description = "Tray widget showing Claude and Codex plan-limit usage"
license = "GPL-3.0-or-later"
repository = "https://github.com/majimawrks/majihanaya"
publish = false

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "=0.26.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dirs = "=7.0.0"
raw-window-handle = "=0.6.2"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "=0.10.4"
regex = "=1.13.1"
ureq = { version = "=3.4.2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

[profile.release]
opt-level = "z"
lto = true
# Unstripped: fully stripped binaries score worse with AV heuristics.
strip = false
# Unwind (not abort): workers catch panics so one bad parse never kills the app.
panic = "unwind"
codegen-units = 1
