[package]
name = "majihanaya"
version = "0.1.0"
edition = "2024"
description = "Tray widget showing Claude and Codex plan-limit usage"
publish = false

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }
tray-icon = "=0.26.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dirs = "=7.0.0"
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
